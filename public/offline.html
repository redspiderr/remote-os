<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REMOTE OS — Offline</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #0B0D17;
      color: #F9F7F2;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 1.5rem;
      background: #1A1D2E;
      border: 1px solid rgba(42,111,187,0.2);
      border-radius: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon svg {
      width: 32px;
      height: 32px;
      color: #6B7280;
    }
    h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 0 0 0.5rem;
    }
    p {
      font-size: 0.875rem;
      color: #6B7280;
      margin: 0 0 1.5rem;
      max-width: 300px;
    }
    button {
      background: #2A6FBB;
      color: #fff;
      border: none;
      padding: 0.625rem 1.25rem;
      border-radius: 0.625rem;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background: #1f5a9c;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/>
      </svg>
    </div>
    <h1>You are offline</h1>
    <p>REMOTE OS requires an internet connection to load the latest standups. Your offline recordings are queued and will sync automatically.</p>
    <button onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
